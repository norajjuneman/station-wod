<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#11161c"><title>Station WOD</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f4f6f8;background:#11161c}*{box-sizing:border-box}body{margin:0}main{max-width:560px;margin:auto;padding:22px 18px 100px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:2px}.orange{color:#ffad38}.muted{color:#aab2bd}.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase}.hero{margin:24px 0 16px;padding:25px 22px;border-radius:20px;background:linear-gradient(125deg,#303c4a,#1a242e 70%);border:1px solid #45515e}h1{font-size:34px;line-height:1.1;margin:8px 0}h2{font-size:22px;margin:0 0 14px}.pill{display:inline-block;padding:7px 10px;border-radius:100px;background:#38424d;color:#e4e8ec;font-size:12px;margin:5px 5px 5px 0}.btn{background:#ffa62b;color:#171717;border:0;border-radius:12px;padding:15px 18px;font-weight:800;width:100%;cursor:pointer;margin-top:16px}.btn.secondary{background:#2d3742;color:white}.panel{border:1px solid #333f4b;border-radius:16px;padding:18px;margin:16px 0;background:#1a222b}.exercise{padding:14px 0;border-bottom:1px solid #34404b;display:flex;justify-content:space-between;gap:12px}.exercise:last-child{border-bottom:0}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#161e27;border-top:1px solid #37424c;padding:10px 8px max(10px,env(safe-area-inset-bottom))}.nav-inner{width:min(560px,100%);display:flex}.nav button{flex:1;background:transparent;color:#aab2bd;border:0;padding:10px 2px;cursor:pointer;font-size:12px}.nav button.active{color:#ffad38;font-weight:800}.hide{display:none}#timer{font-size:52px;text-align:center;font-variant-numeric:tabular-nums;font-weight:800;margin:12px}label{display:block;font-size:13px;color:#c6cdd4;margin:12px 0 5px}input{width:100%;background:#121920;border:1px solid #46515d;border-radius:9px;color:white;padding:12px;font:inherit}small{color:#aab2bd}a{color:#ffad38}</style></head><body><main><div class="top"><div class="brand"><span class="orange">◆</span> STATION WOD</div><span class="eyebrow muted">Crew Fitness</span></div><section id="today"><div class="hero"><div class="eyebrow orange" id="dateLabel"></div><h1 id="workoutTitle"></h1><div class="muted" id="focus"></div><div class="muted" id="syncStatus" style="font-size:12px;margin-top:9px"></div><div id="pills"></div><button class="btn" onclick="startWorkout()">START WORKOUT</button></div><div class="panel"><h2>Today's Circuit</h2><div id="exercises"></div></div><div class="panel"><h2>Workout Timer</h2><div id="timer">15:00</div><button class="btn secondary" onclick="toggleTimer()" id="timerButton">Start timer</button><button class="btn secondary" onclick="resetTimer()">Reset timer</button></div><button class="btn" onclick="completeWorkout()">✓ Mark workout complete</button></section><section id="week" class="hide"><h1>Next 7 Days</h1><div id="weekItems"></div></section><section id="mobility" class="hide"><h1>Mobility Library</h1><p class="muted">Move gently within a comfortable range.</p><div id="mobilityItems"></div></section><section id="history" class="hide"><h1>My History</h1><p class="muted">Saved only on this device.</p><div id="historyItems"></div></section></main><nav class="nav"><div class="nav-inner"><button class="active" onclick="tab('today',this)">TODAY</button><button onclick="tab('week',this)">WEEK</button><button onclick="tab('mobility',this)">MOBILITY</button><button onclick="tab('history',this)">HISTORY</button></div></nav><script>
// EDIT THIS DATA to program your crew's workouts. Day 0 = Sunday.
const workouts=[
{day:0,title:'Recovery & Mobility',focus:'Active recovery',minutes:15,equipment:'Mat',rounds:'Easy flow',exercises:[['Cat-cow','60 sec'],['Hip flexor stretch','45 sec/side'],['Thoracic rotations','8/side'],['Calf stretch','45 sec/side']]},
{day:1,title:'Fireground Strength',focus:'Full-body strength',minutes:15,equipment:'Kettlebell',rounds:'3 rounds',exercises:[['Goblet squats','10 reps'],['Push-ups','10 reps'],['Bent-over rows','12 reps'],['Farmer carry','30 sec']]},
{day:2,title:'Engine Cardio',focus:'Aerobic conditioning',minutes:15,equipment:'None',rounds:'Intervals',exercises:[['Brisk march or jog','2 min'],['Step-ups','1 min'],['Easy walk','1 min'],['Repeat','3 rounds']]},
{day:3,title:'Core & Carry',focus:'Functional strength',minutes:15,equipment:'Dumbbells',rounds:'3 rounds',exercises:[['Dead bug','10/side'],['Suitcase carry','30 sec/side'],['Reverse lunges','8/side'],['Plank','30 sec']]},
{day:4,title:'Mobility Reset',focus:'Joint mobility',minutes:15,equipment:'Mat',rounds:'Easy flow',exercises:[['90/90 hip switches','8/side'],['Open book rotations','8/side'],['Wall slides','10 reps'],['Ankle rocks','10/side']]},
{day:5,title:'Crew Circuit',focus:'Strength + conditioning',minutes:15,equipment:'Dumbbells',rounds:'3 rounds',exercises:[['Squat to press','10 reps'],['Step-ups','12 reps'],['Rows','12 reps'],['Fast walk','60 sec']]},
{day:6,title:'Recovery Walk',focus:'Aerobic base',minutes:15,equipment:'None',rounds:'Steady pace',exercises:[['Easy walk','3 min'],['Brisk walk','10 min'],['Easy walk','2 min']]}
];
const mobility=[['Neck','Gentle neck rotations','5 each direction'],['Shoulders','Wall slides','10 reps'],['Upper back','Open book rotations','8 each side'],['Wrists','Wrist circles','10 each direction'],['Hips','90/90 switches','8 each side'],['Hip flexors','Half-kneeling stretch','30 sec each side'],['Hamstrings','Standing hamstring stretch','30 sec each side'],['Ankles','Knee-to-wall rocks','10 each side'],['Calves','Wall calf stretch','30 sec each side']];
// PASTE YOUR PUBLISHED GOOGLE SHEET CSV URL BETWEEN THE QUOTES.
const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR3AjSLRACkAioRj2FdmWyUaH9Nbe4Vi9d5wGFRKNXcWx1DEFUDAmXphhugvqugp7s-DWbzOEX5-6Kw/pub?gid=0&single=true&output=csv';
const now=new Date();
function isoDate(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
const dateKey=isoDate(now);
let scheduled=[],today={title:'No workout scheduled',focus:'Check back when a workout is published for today.',minutes:15,equipment:'None',rounds:'—',exercises:[]},remaining=900,interval=null;
function parseDate(value){const v=String(value||'').trim();if(/^\d{4}-\d{2}-\d{2}$/.test(v)){const d=new Date(v+'T12:00:00');return !isNaN(d)&&isoDate(d)===v?v:''}const m=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(m){const date=`${m[3]}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;return parseDate(date)}return ''}
function selectToday(){today=scheduled.find(w=>w.date===dateKey)||{title:'No workout scheduled',focus:'No workout has been assigned to today.',minutes:15,equipment:'None',rounds:'—',exercises:[]}}
function csvRows(raw){const rows=[];let row=[],field='',quoted=false;for(let i=0;i<raw.length;i++){const c=raw[i];if(c==='"'){if(quoted&&raw[i+1]==='"'){field+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(field);field=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&raw[i+1]==='\n')i++;row.push(field);if(row.some(x=>x.trim()))rows.push(row);row=[];field=''}else field+=c}row.push(field);if(row.some(x=>x.trim()))rows.push(row);return rows}
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function loadSheet(){
const status=document.getElementById('syncStatus');
if(!SHEET_CSV_URL){status.textContent='Connect your published Google Sheet to load workouts';return}
status.textContent='Checking published workouts…';
try{
const res=await fetch(SHEET_CSV_URL,{cache:'no-store'});if(!res.ok)throw Error('Sheet request failed');
const rows=csvRows(await res.text());if(rows.length<2)throw Error('No workout rows found');
const headers=rows.shift().map(h=>h.trim().toLowerCase());
const expected=['date','title','focus','minutes','equipment','rounds','exercises'];
if(expected.some(h=>!headers.includes(h)))throw Error('Add the Date column and keep the existing workout columns');
const updated=rows.map(r=>Object.fromEntries(headers.map((h,i)=>[h,(r[i]||'').trim()]))).filter(r=>r.title).map(r=>({date:parseDate(r.date),title:r.title,focus:r.focus,minutes:Number(r.minutes),equipment:r.equipment,rounds:r.rounds,exercises:r.exercises.split('|').map(x=>x.trim()).filter(Boolean).map(x=>{let a=x.split('::');return [a[0].trim(),(a[1]||'').trim()]})})).filter(w=>w.date&&w.minutes>0&&w.minutes<=180);
if(!updated.length)throw Error('No valid dated workouts found');
scheduled=updated.sort((a,b)=>a.date.localeCompare(b.date));selectToday();resetTimer();render();
status.textContent='Calendar synced with Google Sheets';
}catch(err){status.textContent='Unable to load dated workouts — check Date column and published sheet';console.warn('Station WOD sheet sync:',err)}
}
function render(){
document.getElementById('dateLabel').textContent=now.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
document.getElementById('workoutTitle').textContent=today.title;
document.getElementById('focus').textContent=today.focus;
document.getElementById('pills').innerHTML=[today.minutes+' MIN',today.rounds,today.equipment].map(x=>`<span class="pill">${esc(x)}</span>`).join('');
document.getElementById('exercises').innerHTML=today.exercises.length?today.exercises.map(([name,dose])=>`<div class="exercise"><strong>${esc(name)}</strong><span class="muted">${esc(dose)}</span></div>`).join(''):'<p class="muted">No exercises scheduled for today.</p>';
const upcoming=Array.from({length:7},(_,i)=>{let d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+i);return {date:isoDate(d),label:d.toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})}});
document.getElementById('weekItems').innerHTML=upcoming.map(({date,label})=>{const w=scheduled.find(x=>x.date===date);return `<div class="panel"><div class="eyebrow orange">${esc(label)}</div><h2 style="margin:8px 0">${w?esc(w.title):'Not scheduled'}</h2><span class="muted">${w?esc(w.focus)+' · '+w.minutes+' min':'No workout programmed'}</span></div>`}).join('');
document.getElementById('mobilityItems').innerHTML=mobility.map(([region,name,dose])=>`<div class="panel"><div class="eyebrow orange">${esc(region)}</div><h2 style="margin:8px 0">${esc(name)}</h2><span class="muted">${esc(dose)}</span></div>`).join('');renderHistory();drawTimer();
}
function tab(name,btn){document.querySelectorAll('main section').forEach(s=>s.classList.toggle('hide',s.id!==name));document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');scrollTo(0,0)}function drawTimer(){let m=Math.floor(remaining/60),s=remaining%60;document.getElementById('timer').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}function toggleTimer(){if(interval){clearInterval(interval);interval=null;document.getElementById('timerButton').textContent='Resume timer';return}document.getElementById('timerButton').textContent='Pause timer';interval=setInterval(()=>{if(remaining>0){remaining--;drawTimer()}else{clearInterval(interval);interval=null;document.getElementById('timerButton').textContent='Finished'}},1000)}function resetTimer(){clearInterval(interval);interval=null;remaining=today.minutes*60;drawTimer();document.getElementById('timerButton').textContent='Start timer'}function startWorkout(){if(!today.exercises.length){alert('No workout is scheduled for today.');return}document.getElementById('timer').scrollIntoView({behavior:'smooth'});if(!interval)toggleTimer()}function completeWorkout(){if(!today.exercises.length){alert('No workout is scheduled for today.');return}const records=JSON.parse(localStorage.getItem('stationWodHistory')||'[]');if(!records.some(r=>r.date===dateKey)){records.unshift({date:dateKey,title:today.title});localStorage.setItem('stationWodHistory',JSON.stringify(records))}renderHistory();alert('Workout saved on this device!')}function renderHistory(){const records=JSON.parse(localStorage.getItem('stationWodHistory')||'[]');document.getElementById('historyItems').innerHTML=records.length?records.map(r=>`<div class="panel"><strong>${r.title}</strong><div class="muted">${r.date}</div></div>`).join(''):'<div class="panel">No workouts completed yet.</div>'}render();loadSheet();
</script></body></html>
